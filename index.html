    <!-- Critical CSS — inlined to eliminate render-blocking stylesheet request -->
    <style>
      /* === CRITICAL CSS — Prevents CLS & enables instant first paint === */
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;color-scheme:light;scroll-behavior:smooth}
      body{
        font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        background:#EBE7DF;color:#1C1917;line-height:1.6;
        -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden
      }
      #root{min-height:100vh;display:flex;flex-direction:column}
      img{max-width:100%;height:auto;display:block}
      a{color:inherit;text-decoration:none}
      button{font-family:inherit;cursor:pointer;border:0;background:none}
      /* Reserve navbar height to prevent CLS */
      .navbar{height:76px;position:fixed;top:0;left:0;right:0;background:rgba(235,231,223,0.98);backdrop-filter:blur(20px);z-index:1030}
      /* Reserve hero height to prevent layout shift */
      .hero{min-height:85vh;position:relative;background:#EBE7DF;contain:layout}
      .section{padding:4rem 0}
      .container{max-width:1280px;margin:0 auto;padding:0 1rem}
      @media(min-width:768px){.container{padding:0 2rem}}
      /* Skeleton loaders */
      .skeleton-card,.skeleton-image,.skeleton-title,.skeleton-text{
        background:linear-gradient(90deg,rgba(55,65,81,.5) 25%,rgba(75,85,99,.5) 50%,rgba(55,65,81,.5) 75%);
        background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;min-height:12px
      }
      .skeleton-image{height:220px}
      .skeleton-title{height:24px;width:70%;margin-bottom:8px}
      .skeleton-text{height:16px;margin-bottom:6px}
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
      /* Suspense spinner */
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>

    <!-- Razorpay SDK — loaded on-demand, not at startup -->
    <script>
      window.loadRazorpay = function () {
        return new Promise((resolve, reject) => {
          if (window.Razorpay) { resolve(window.Razorpay); return; }
          const script = document.createElement('script');
          script.src = 'https://checkout.razorpay.com/v1/checkout.js';
          script.async = true;
          script.onload = () => resolve(window.Razorpay);
          script.onerror = reject;
          document.head.appendChild(script);
        });
      };
    </script>
